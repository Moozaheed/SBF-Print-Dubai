<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SBF Print & Design Forms</title>
</head>
<body>
  <form name="quotation-request" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="quoteId" />
    <input type="text" name="fullName" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="speed" />
    <textarea name="itemsSummary"></textarea>
    <textarea name="generalNotes"></textarea>
    <input type="text" name="fileName" />
    <input type="email" name="targetEmail" />
  </form>

  <form name="contact-inquiry" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="fullName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="serviceCategory" />
    <textarea name="message"></textarea>
    <input type="email" name="targetEmail" />
  </form>
</body>
</html>
